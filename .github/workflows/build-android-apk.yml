name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "Assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -name Godot -print -quit)"
          curl -L --fail "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Create Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Import and export APK
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --import
          mkdir -p build/android
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/android/ShootMePls-Android.apk
          test -s build/android/ShootMePls-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShootMePls-Android-APK
          path: build/android/ShootMePls-Android.apk
          if-no-files-found: error
          retention-days: 14
