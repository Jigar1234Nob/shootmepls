name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "Assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    name: Export and sign iOS IPA
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.3"
      BUNDLE_ID: "au.jigar.shootmepls"
      APP_NAME: "ShootMePls"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done
          if [ "${#APPLE_TEAM_ID}" -ne 10 ]; then
            echo "::error::APPLE_TEAM_ID must be the 10-character Apple Developer Team ID."
            exit 1
          fi

      - name: Install Godot and iOS export templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -path "*/Contents/MacOS/Godot" -print -quit)"
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -name Godot -perm -111 -print -quit)"
          fi
          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Could not locate the Godot executable in the downloaded archive."
            exit 1
          fi
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          if [ -d "$RUNNER_TEMP/templates/templates" ]; then
            cp -R "$RUNNER_TEMP/templates/templates/." "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
          else
            cp -R "$RUNNER_TEMP/templates/." "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
          fi
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Set Apple Team ID in export preset
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("export_presets.cfg")
          data = path.read_text()
          data = data.replace("TEAM_ID_PLACEHOLDER", os.environ["APPLE_TEAM_ID"])
          path.write_text(data)
          PY

      - name: Import project resources
        run: |
          "$GODOT_BIN" --headless --editor --path . --import

      - name: Export Xcode project
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --export-release "iOS" "build/ios/${APP_NAME}.xcodeproj"
          PROJECT="$(find build/ios -maxdepth 3 -name "*.xcodeproj" -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "::error::Godot did not produce an Xcode project."
            exit 1
          fi
          echo "XCODE_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          xcodebuild -list -project "$PROJECT"

      - name: Install Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install iOS provisioning profile
        id: profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          case "$PROFILE_APP_ID" in
            *."$BUNDLE_ID") ;;
            *) echo "::error::Provisioning profile does not match $BUNDLE_ID (found $PROFILE_APP_ID)"; exit 1 ;;
          esac

      - name: Archive iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
        run: |
          set -euo pipefail
          SCHEME="$(xcodebuild -list -json -project "$XCODE_PROJECT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          echo "Using Xcode scheme: $SCHEME"
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ShootMePls.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      - name: Export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ShootMePls.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/ipa-export/"*.ipa "build/ipa/ShootMePls-iOS.ipa"
          test -s "build/ipa/ShootMePls-iOS.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShootMePls-iOS-IPA
          path: build/ipa/ShootMePls-iOS.ipa
          if-no-files-found: error
          retention-days: 14
