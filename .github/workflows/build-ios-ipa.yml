name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "Assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.3"
      APP_NAME: "ShootMePls"
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          curl -L --fail "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -path "*/Contents/MacOS/Godot" -print -quit)"
          curl -L --fail "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$HOME/Library/Application Support/Godot/export_templates/4.3.stable/"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import and export unsigned Xcode project
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --import
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --export-release "iOS" "build/ios/$APP_NAME.xcodeproj"
          PROJECT="$(find build/ios -maxdepth 3 -name "*.xcodeproj" -print -quit)"
          test -n "$PROJECT"
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/derived CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP="$(find build/derived/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)"
          test -d "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && /usr/bin/zip -qry ShootMePls-iOS-unsigned.ipa Payload)
          test -s build/ipa/ShootMePls-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ShootMePls-iOS-unsigned-IPA
          path: build/ipa/ShootMePls-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
